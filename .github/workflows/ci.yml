name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, gd
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci

      # Las vistas usan @vite: hace falta el manifest para renderizarlas en los tests
      - name: Build the assets
        run: npm run build

      # Estilo de código (Laravel Pint); en local: composer lint:fix
      - name: Check the code style
        run: vendor/bin/pint --test

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # phpunit.xml usa SQLite en memoria: no hace falta un servidor MySQL
      - name: Run the tests
        run: php artisan test
